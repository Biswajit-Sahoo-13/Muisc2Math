name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One shell for every runner. Windows defaults to PowerShell, where `set -o
# pipefail` is a parse error, so the test step has to opt into bash.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: |
          set -o pipefail
          pytest tests/ -q --tb=short -rf 2>&1 | tee test-output.txt
          # Put the output in the job summary so a failure is diagnosable
          # without needing log access to the runner.
          {
            echo "### pytest output"
            echo '```'
            cat test-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-py${{ matrix.python }}
          path: test-output.txt
          if-no-files-found: ignore
      # A commit status is readable without a token, so the failing test is
      # visible without needing access to the runner logs.
      - name: Report the failure as a commit status
        if: failure()
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          try:
              text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          except OSError:
              text = ""
          fails = [l for l in text.splitlines() if l.startswith(("FAILED", "ERROR"))]
          desc = " | ".join(re.sub(r" - .*", "", l) for l in fails[:6])[:130] \
              or "pytest failed - see the artifact"
          body = json.dumps({"state": "failure", "description": desc,
                             "context": "pytest"}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/%s/statuses/%s"
              % (os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"]),
              data=body, method="POST",
              headers={"Authorization": "token " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          try:
              urllib.request.urlopen(req, timeout=30).read()
          except Exception as exc:
              print("status post failed:", exc)
          print("::error::" + desc)
          PY

  python-versions:
    name: test ubuntu / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install --upgrade pip
          /tmp/wheelenv/bin/pip install dist/*.whl
          # the package must import on its own, not from the checkout
          cd /tmp && /tmp/wheelenv/bin/python -c "import src.res_loop, src.res_evidence; print('imports ok')"
      - name: The console script works
        run: /tmp/wheelenv/bin/m2m --help
      - name: A real job runs from the installed package
        run: |
          /tmp/wheelenv/bin/m2m res \
            -i data/output/_fixtures/stem_drums.wav \
            -o /tmp/ciout -d 3 --iterations 1
          test -f /tmp/ciout/res_ledger.json
          test -f /tmp/ciout/res_best.wav
          test -f /tmp/ciout/res_equations.txt

  scoreboard:
    name: published numbers still match their ledgers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Every published figure is a row in scoreboard.json pointing at a
      # ledger. This fails if a row was edited to a number its ledger does not
      # support, or if a label that must improve stops improving.
      - name: Verify the scoreboard
        run: python tools/verify_scoreboard.py

  bundle:
    name: the project bundle builds and is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # The bundle is gitignored (it duplicates tracked source), so it cannot be
      # diffed for staleness. This checks the generator still works and that the
      # bundle actually contains every file it claims to.
      - name: Build the bundle and check it is complete
        run: |
          python tools/build_project_bundle.py
          python - <<'PY'
          import re
          from pathlib import Path
          s = Path("PROJECT_BUNDLE.md").read_text(encoding="utf-8")
          files = re.findall(r"^## File \d+: `([^`]+)`", s, re.M)
          assert len(files) == 10, f"expected 10 files, got {len(files)}"
          for f in files:
              assert f in s, f"bundle does not mention {f}"
          assert "What this project does" in s, "bundle lost its header"
          assert s.count("```") % 2 == 0, "unbalanced code fences"
          print(f"bundle ok: {len(files)} files, {len(s):,} chars")
          PY
