name: Release

# A tag is the only thing that publishes. The CI workflow proves the tree is
# good; this workflow turns that proof into something installable.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the tag
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --tags && git checkout "${{ github.event.inputs.tag }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::tag $TAG does not match the package version $VER"
            exit 1
          fi
      - name: Build the project bundle
        run: python tools/build_project_bundle.py
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # Never publish an artefact that was not installed and run first.
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/releaseenv
          /tmp/releaseenv/bin/python -m pip install --upgrade pip
          /tmp/releaseenv/bin/pip install dist/*.whl
          cd /tmp && /tmp/releaseenv/bin/python -c "import src.res_loop; print('imports ok')"
          /tmp/releaseenv/bin/m2m --help > /dev/null
          /tmp/releaseenv/bin/m2m res \
            -i data/output/_fixtures/stem_drums.wav \
            -o /tmp/releaseout -d 3 --iterations 1
          test -f /tmp/releaseout/res_best.wav
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ASSETS=(dist/*.whl dist/*.tar.gz PROJECT_BUNDLE.md PROJECT_BUNDLE.zip)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes "${ASSETS[@]}"
          fi
          gh release view "$TAG" --json tagName,name,url
