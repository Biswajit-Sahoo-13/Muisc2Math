name: Release

# A tag is the only thing that publishes. The CI workflow proves the tree is
# good; this workflow turns that proof into something installable.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the tag
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --tags && git checkout "${{ github.event.inputs.tag }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: The tag matches the package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VER=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::tag $TAG does not match the package version $VER"
            exit 1
          fi
      - name: Build the project bundle
        run: python tools/build_project_bundle.py
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # Never publish an artefact that was not installed and run first.
      - name: Install the wheel in a clean environment and use it
        run: |
          python -m venv /tmp/releaseenv
          /tmp/releaseenv/bin/python -m pip install --upgrade pip
          /tmp/releaseenv/bin/pip install dist/*.whl
          cd /tmp
          # The import has to come from the installed package, not the checkout.
          /tmp/releaseenv/bin/python -c "import src.res_loop; print('imported from', src.res_loop.__file__)"
          /tmp/releaseenv/bin/m2m --help > /dev/null
          /tmp/releaseenv/bin/m2m res \
            -i "$GITHUB_WORKSPACE/data/output/_fixtures/stem_drums.wav" \
            -o /tmp/releaseout -d 3 --iterations 1
          test -f /tmp/releaseout/res_best.wav
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.error, urllib.parse, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/" + repo
          base_headers = {"Authorization": "token " + token,
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "m2m-release"}

          def call(method, url, data=None, ctype="application/json"):
              headers = dict(base_headers)
              headers["Content-Type"] = ctype
              req = urllib.request.Request(url, data=data, method=method,
                                           headers=headers)
              with urllib.request.urlopen(req, timeout=300) as resp:
                  raw = resp.read()
              return json.loads(raw) if raw else {}

          notes = pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          try:
              try:
                  release = call("POST", api + "/releases", json.dumps({
                      "tag_name": tag, "name": tag, "body": notes,
                      "draft": False, "prerelease": False}).encode())
                  print("created release", release["id"])
              except urllib.error.HTTPError as exc:
                  if exc.code != 422:
                      raise
                  release = call("GET", api + "/releases/tags/" + tag)
                  print("release already exists", release["id"])

              upload = ("https://uploads.github.com/repos/%s/releases/%d/assets"
                        % (repo, release["id"]))
              files = sorted(p for p in pathlib.Path("dist").glob("*") if p.is_file())
              files += [p for p in (pathlib.Path("PROJECT_BUNDLE.md"),
                                    pathlib.Path("PROJECT_BUNDLE.zip")) if p.is_file()]
              if not files:
                  raise SystemExit("no artefacts to publish")
              for path in files:
                  for asset in release.get("assets", []):
                      if asset["name"] == path.name:
                          call("DELETE", api + "/releases/assets/" + str(asset["id"]))
                  payload = path.read_bytes()
                  req = urllib.request.Request(
                      upload + "?name=" + urllib.parse.quote(path.name),
                      data=payload, method="POST",
                      headers={"Authorization": "token " + token,
                               "Accept": "application/vnd.github+json",
                               "User-Agent": "m2m-release",
                               "Content-Type": "application/octet-stream"})
                  with urllib.request.urlopen(req, timeout=300) as resp:
                      print("uploaded", path.name, len(payload), "bytes")
              final = call("GET", api + "/releases/tags/" + tag)
              print("release url:", final["html_url"])
              for asset in final.get("assets", []):
                  print("  asset", asset["name"], asset["size"], "bytes")
          except Exception as exc:
              detail = ("%s: %s" % (type(exc).__name__, exc))[:130]
              body = json.dumps({"state": "failure", "description": detail,
                                 "context": "release"}).encode()
              req = urllib.request.Request(
                  "https://api.github.com/repos/%s/statuses/%s"
                  % (repo, os.environ["GITHUB_SHA"]),
                  data=body, method="POST",
                  headers={"Authorization": "token " + token,
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "m2m-release",
                           "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=30).read()
              except Exception:
                  pass
              raise
          PY
